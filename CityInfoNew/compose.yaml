services:
  postgres:
    image: postgres:latest
    container_name: cityinfo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cityinfo
      POSTGRES_PASSWORD: cityinfo_dev
      POSTGRES_DB: cityinfo

    ports:
      - "5432:5432"

    volumes:
      - cityinfo-postgres-data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cityinfo-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cityinfo.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev

    ports:
      - "5050:80"

    depends_on:
      - postgres

  seq:
    image: datalust/seq:latest
    container_name: cityinfo-seq
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "SeqAdmin123!"

    ports:
      - "5341:80"

    volumes:
      - cityinfo-seq-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: cityinfo-mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  cityinfo-postgres-data:
  cityinfo-seq-data:
