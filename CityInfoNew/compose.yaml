services:
  postgres:
    image: postgres:18
    container_name: cityinfo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cityinfo
      POSTGRES_PASSWORD: cityinfo_dev
      POSTGRES_DB: cityinfo

    ports:
      - "5432:5432"

    volumes:
      - cityinfo-postgres-data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cityinfo-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cityinfo.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  cityinfo-postgres-data:
